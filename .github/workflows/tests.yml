name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Ruff targets requires-python in pyproject.toml regardless of the interpreter it runs on.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check --output-format=github

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # mypy targets python_version in pyproject.toml regardless of the interpreter it runs on, so a single job is
      # sufficient. Run it on that same minimum version so installed dependencies and stubs match what users on the
      # minimum get. Keep this equal to python_version.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Type-check with mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest
